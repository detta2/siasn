<style>
/* === Initial loading state (statis, sebelum JS jalan) ===
   Isi #app ini otomatis tertimpa saat app.js selesai render pertama. */
.siasn-boot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:#ffffff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0b2239}
.siasn-boot-spinner{width:52px;height:52px;border-radius:50%;border:5px solid #d7eef7;border-top-color:#0096c7;animation:siasn-spin .8s linear infinite}
@keyframes siasn-spin{to{transform:rotate(360deg)}}
.siasn-boot-title{font-size:30px;font-weight:800;letter-spacing:.5px;color:#0096c7;margin-top:8px}
.siasn-boot-text{font-size:16px;font-weight:600;margin:0}
.siasn-boot-sub{font-size:13px;color:#5b7186;margin:0}
.siasn-boot-slow{display:none;font-size:13px;color:#b45309;margin-top:10px}
</style>

<noscript>

  </div>
</noscript>
<div id="app">
  <!-- Loading state statis: tertimpa otomatis oleh render pertama app.js -->
  <div class="siasn-boot" role="status" aria-label="Memuat aplikasi SiASN">
    <div class="siasn-boot-spinner" aria-hidden="true"></div>
    <div class="siasn-boot-title">SiASN</div>
    <p class="siasn-boot-text">Memuat Sistem SIASN...</p>
    <p class="siasn-boot-sub">Menyiapkan 19.900+ soal TWK • TIU • TKP</p>
    <p class="siasn-boot-slow" id="siasnBootSlow">Koneksi lambat? Tunggu sebentar lagi — atau <a href="" onclick="location.reload();return false;" style="color:#0096c7;font-weight:700">muat ulang halaman</a>.</p>
  </div>
</div>
<script>
/* Watchdog loading: kalau app belum render juga setelah 12 detik,
   tampilkan petunjuk muat ulang (spinner saja bikin user bingung). */
setTimeout(function(){var b=document.querySelector(".siasn-boot"),s=document.getElementById("siasnBootSlow");if(b&&s)s.style.display="block";},12000);
</script>
