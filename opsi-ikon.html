<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilih Ikon — SiASN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:radial-gradient(circle at 88% 6%,#e3f2fd 0 90px,transparent 91px),#fff;padding:20px;max-width:560px;margin:0 auto;color:#0b3d5c}
h1{text-align:center;font-size:22px;margin:8px 0 4px}
.sub{text-align:center;color:#5b7a8c;font-size:14px;margin-bottom:18px}
.note{background:#fff;border:2px solid #0b3d5c;border-radius:14px;padding:14px;font-size:13px;color:#33566b;margin-bottom:20px;box-shadow:3px 3px 0 #0b3d5c}
.set{background:#fff;border:2px solid #0b3d5c;border-radius:20px;margin-bottom:22px;overflow:hidden;box-shadow:4px 4px 0 #0b3d5c}
.set .tag{background:#0b3d5c;color:#fff;font-weight:800;padding:10px 16px;font-size:16px;display:flex;justify-content:space-between}
.set .tag small{font-weight:600;opacity:.75;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.tile{background:#f2f8fd;border:2px solid #bfe3f5;border-radius:16px;padding:14px 8px;text-align:center}
.tile .ic{display:flex;justify-content:center;margin-bottom:8px;height:44px;align-items:center}
.tile .ic svg{width:38px;height:38px}
.tile b{font-size:13px;display:block}
.doodle svg{transform:rotate(-6deg)}
</style>
</head>
<body>
<h1>🎨 Pilih Set Ikon</h1>
<p class="sub">Pratinjau di atas tema Ombak Minimalis — balas angka 1–4</p>
<div class="note">Ikon yang kamu pilih aku pasang ke <b>seluruh web</b> (menu, kategori, tombol). Bentuknya finalnya aku rapihin lagi biar presisi.</div>
<div id="sets"></div>
<script>
var P={
pencil:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/>',
stopwatch:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5"/><path d="M9.5 2.5h5"/><path d="M12 2.5V6"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
robot:'<rect x="4.5" y="8.5" width="15" height="11" rx="2.5"/><path d="M12 8.5V4.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9.3" cy="13.2" r="1.2" fill="NAVY" stroke="none"/><circle cx="14.7" cy="13.2" r="1.2" fill="NAVY" stroke="none"/><path d="M9.5 16.8h5"/>',
route:'<circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="6" r="2.6"/><path d="M8.6 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>',
zap:'<path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/>'};
var PS={
pencil:'<path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z" fill="#0b3d5c"/><path d="M14.8 5.8l3.4 3.4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/>',
stopwatch:'<rect x="9" y="1.5" width="6" height="2.8" rx="1.4" fill="#0b3d5c"/><path d="M12 4.3V6.2" stroke="#0b3d5c" stroke-width="2.2"/><circle cx="12" cy="13.8" r="8" fill="#0b3d5c"/><path d="M12 10.3v3.5l2.5 1.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>',
book:'<path d="M6.5 2H20a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="#0b3d5c"/>',
robot:'<circle cx="12" cy="4.8" r="1.8" fill="#0b3d5c"/><path d="M12 6.6V8.2" stroke="#0b3d5c" stroke-width="2"/><rect x="4" y="8" width="16" height="12" rx="3" fill="#0b3d5c"/><circle cx="9.2" cy="13" r="1.4" fill="#fff"/><circle cx="14.8" cy="13" r="1.4" fill="#fff"/><rect x="9" y="15.8" width="6" height="1.9" rx=".95" fill="#fff"/>',
route:'<circle cx="6" cy="18" r="3" fill="#0b3d5c"/><circle cx="18" cy="6" r="3" fill="#0b3d5c"/><path d="M9 18h6a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" stroke="#0b3d5c" stroke-width="3" fill="none" stroke-linecap="round"/>',
zap:'<path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z" fill="#0b3d5c"/>'};
var LABELS={pencil:"Latihan",stopwatch:"Tryout",book:"Materi",robot:"Mentor",route:"Jalur",zap:"Trik"};
var SETS=[
{name:"1 — Outline Navy",desc:"garis tipis • rapi",cls:"",paint:{stroke:"#0b3d5c",fill:"none",sw:2},paths:P},
{name:"2 — Doodle Teal",desc:"lucu • miring dikit",cls:"doodle",paint:{stroke:"#0096c7",fill:"none",sw:2.6},paths:P},
{name:"3 — Solid Navy",desc:"tegas • bold",cls:"",paint:null,paths:PS},
{name:"4 — Duotone Laut",desc:"dua warna • modern",cls:"",paint:{stroke:"#0b3d5c",fill:"#bfe3f5",sw:2},paths:P}];
function svgFor(set,key){
 var inner=set.paths[key].replace(/NAVY/g,"#0b3d5c");
 if(set.paint){
  return '<svg viewBox="0 0 24 24" fill="'+set.paint.fill+'" stroke="'+set.paint.stroke+'" stroke-width="'+set.paint.sw+'" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
 }
 return '<svg viewBox="0 0 24 24">'+inner+'</svg>';
}
var html="";
SETS.forEach(function(s){
 html+='<div class="set"><div class="tag"><span>'+s.name+'</span><small>'+s.desc+'</small></div><div class="tiles">';
 Object.keys(LABELS).forEach(function(k){
  html+='<div class="tile"><span class="ic '+s.cls+'">'+svgFor(s,k)+'</span><b>'+LABELS[k]+'</b></div>';
 });
 html+='</div></div>';
});
document.getElementById("sets").innerHTML=html;
</script>
</body>
</html>
